version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.devcontainer.env
    volumes:
      - ../..:/src:cached
    command:
      - bash
      - -c
      - |
        cd /src
        bash -i -c 'nvm install'
        tern status
        tern migrate
        sleep infinity
    depends_on:
      - db
      - localstack

  oidc:
    image: ugentlib/mock-oidc-server
    restart: unless-stopped
    volumes:
      - ./oidc:/dist/.data
    env_file:
      - ../.devcontainer.env
    network_mode: service:app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DATABASE: deliver
      POSTGRES_USER: deliver
      POSTGRES_PASSWORD: deliver
      PGPORT: 3151
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliver -d deliver"]
      interval: 30s
      timeout: 10s
      retries: 5

  localstack:
    image: gresau/localstack-persist:4
    environment:
      SERVICES: s3
      GATEWAY_LISTEN: 0.0.0.0:3171
    volumes:
      - localstack-data:/persisted-data
      - ./localstack/create-bucket.sh:/etc/localstack/init/ready.d/create-bucket.sh:ro
    healthcheck:
      test: curl -s -f localhost:3171/_localstack/health >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
    driver: local
  localstack-data:
    driver: local
